<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Nota Saya</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #111827;
      transition: .2s;
    }
    body.dark { background: #111827; color: #f9fafb; }
    .app { max-width: 700px; margin: auto; min-height: 100vh; padding: 20px 16px 90px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 28px; }
    button {
      border: 0; border-radius: 12px; padding: 10px 13px;
      cursor: pointer; font-size: 15px;
    }
    .icon-btn { background: #e5e7eb; }
    .dark .icon-btn { background: #374151; color: white; }
    .search {
      width: 100%; margin: 18px 0 14px; padding: 13px 15px;
      border: 1px solid #d1d5db; border-radius: 13px; font-size: 16px;
      background: white; color: #111827; outline: none;
    }
    .dark .search { background: #1f2937; color: white; border-color: #4b5563; }
    .notes { display: grid; gap: 12px; }
    .note {
      background: white; border-radius: 16px; padding: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }
    .dark .note { background: #1f2937; }
    .note h2 { margin: 0 0 7px; font-size: 18px; }
    .note p {
      margin: 0; white-space: pre-wrap; color: #4b5563;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .dark .note p { color: #d1d5db; }
    .date { font-size: 12px; color: #9ca3af; margin-top: 10px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .edit { background: #dbeafe; color: #1d4ed8; }
    .delete { background: #fee2e2; color: #b91c1c; }
    .empty { text-align: center; padding: 45px 10px; color: #6b7280; }
    .fab {
      position: fixed; right: 22px; bottom: 22px; width: 58px; height: 58px;
      border-radius: 50%; background: #2563eb; color: white; font-size: 28px;
      box-shadow: 0 8px 22px rgba(37,99,235,.35);
    }
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: none; align-items: center; justify-content: center; padding: 18px;
    }
    .modal.show { display: flex; }
    .box {
      width: 100%; max-width: 600px; background: white; color: #111827;
      border-radius: 18px; padding: 18px;
    }
    .dark .box { background: #1f2937; color: white; }
    .box h2 { margin-top: 0; }
    .field {
      width: 100%; margin-bottom: 12px; padding: 13px;
      border: 1px solid #d1d5db; border-radius: 12px; font: inherit;
      outline: none;
    }
    .textarea { min-height: 180px; resize: vertical; }
    .dark .field { background: #111827; color: white; border-color: #4b5563; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .cancel { background: #e5e7eb; }
    .save { background: #2563eb; color: white; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>📝 Nota Saya</h1>
      <button class="icon-btn" id="themeBtn" aria-label="Tukar tema">🌙</button>
    </header>

    <input id="search" class="search" type="search" placeholder="🔍 Cari nota...">

    <section id="notes" class="notes"></section>
  </main>

  <button class="fab" id="addBtn" aria-label="Tambah nota">+</button>

  <div class="modal" id="modal">
    <div class="box">
      <h2 id="modalTitle">Tambah Nota</h2>
      <input id="title" class="field" maxlength="80" placeholder="Tajuk nota">
      <textarea id="content" class="field textarea" placeholder="Tulis nota anda..."></textarea>
      <div class="modal-actions">
        <button class="cancel" id="cancelBtn">Batal</button>
        <button class="save" id="saveBtn">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "nota_saya_v1";
    const THEME_KEY = "nota_saya_theme";

    let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let editingId = null;

    const notesEl = document.getElementById("notes");
    const modal = document.getElementById("modal");
    const titleEl = document.getElementById("title");
    const contentEl = document.getElementById("content");
    const searchEl = document.getElementById("search");

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function escapeHTML(text) {
      return String(text).replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      }[c]));
    }

    function formatDate(timestamp) {
      return new Date(timestamp).toLocaleString("ms-MY", {
        dateStyle: "medium", timeStyle: "short"
      });
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();

      const filtered = notes.filter(n =>
        n.title.toLowerCase().includes(query) ||
        n.content.toLowerCase().includes(query)
      );

      if (!filtered.length) {
        notesEl.innerHTML = `<div class="empty">${
          notes.length ? "Tiada nota yang sepadan dengan carian." :
          "Belum ada nota.<br>Tekan butang + untuk mula."
        }</div>`;
        return;
      }

      notesEl.innerHTML = filtered.map(n => `
        <article class="note">
          <h2>${escapeHTML(n.title || "Tanpa tajuk")}</h2>
          <p>${escapeHTML(n.content)}</p>
          <div class="date">${formatDate(n.updatedAt)}</div>
          <div class="actions">
            <button class="edit" onclick="editNote('${n.id}')">✏️ Edit</button>
            <button class="delete" onclick="deleteNote('${n.id}')">🗑️ Padam</button>
          </div>
        </article>
      `).join("");
    }

    function openModal(id = null) {
      editingId = id;
      document.getElementById("modalTitle").textContent = id ? "Edit Nota" : "Tambah Nota";

      if (id) {
        const note = notes.find(n => n.id === id);
        titleEl.value = note?.title || "";
        contentEl.value = note?.content || "";
      } else {
        titleEl.value = "";
        contentEl.value = "";
      }

      modal.classList.add("show");
      setTimeout(() => titleEl.focus(), 50);
    }

    function closeModal() {
      modal.classList.remove("show");
      editingId = null;
    }

    function saveNote() {
      const title = titleEl.value.trim();
      const content = contentEl.value.trim();

      if (!content) {
        alert("Sila tulis sesuatu dalam nota.");
        contentEl.focus();
        return;
      }

      if (editingId) {
        const note = notes.find(n => n.id === editingId);
        if (note) {
          note.title = title;
          note.content = content;
          note.updatedAt = Date.now();
        }
      } else {
        notes.unshift({
          id: Date.now().toString(),
          title,
          content,
          updatedAt: Date.now()
        });
      }

      saveData();
      render();
      closeModal();
    }

    window.editNote = function(id) {
      openModal(id);
    };

    window.deleteNote = function(id) {
  notes = notes.filter(n => n.id !== id);
  saveData();
  render();
};

    document.getElementById("addBtn").addEventListener("click", () => openModal());
    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    document.getElementById("saveBtn").addEventListener("click", saveNote);
    searchEl.addEventListener("input", render);

    modal.addEventListener("click", e => {
      if (e.target === modal) closeModal();
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      document.body.classList.toggle("dark");
      localStorage.setItem(
        THEME_KEY,
        document.body.classList.contains("dark") ? "dark" : "light"
      );
    });

    if (localStorage.getItem(THEME_KEY) === "dark") {
      document.body.classList.add("dark");
    }

    render();
  </script>
</body>
</html>
